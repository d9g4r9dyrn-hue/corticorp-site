<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 1200x630 link-preview card. render.cjs fills it from cards.json and screenshots it. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 1200px; height: 630px; overflow: hidden }
  body { background: #0c0a08; color: #e8e0d4; position: relative;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(620px 520px at 82% 50%, var(--glow), transparent 70%) }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
    display: flex; flex-direction: column; justify-content: center }
  .brand { font-weight: 800; font-size: 26px; color: #e7c878; letter-spacing: .03em; margin-bottom: 42px }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.01em }
  .sub { font-size: 34px; line-height: 1.2; color: var(--accent); font-weight: 400; margin-top: 14px }
  .tag { font-size: 25px; line-height: 1.45; color: #9a8e7a; margin-top: 26px }
  .url { position: absolute; left: 72px; bottom: 44px; font-size: 21px; color: #6f6656; letter-spacing: .02em }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--accent) }

  .logo { position: absolute; right: 70px; top: 50%; width: 440px; height: 440px; margin-top: -220px;
    border-radius: 50%; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06) }

  .win { position: absolute; left: 690px; top: 92px; width: 640px; border-radius: 14px; overflow: hidden;
    border: 1px solid #2c313a; background: #14171c; box-shadow: 0 30px 80px rgba(0,0,0,.65) }
  .win .b { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
    background: #20242b; border-bottom: 1px solid #2c313a }
  .win .b i { width: 12px; height: 12px; border-radius: 50% }
  .win img { display: block; width: 100%; height: 412px; object-fit: cover; object-position: top left }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="text">
    <div class="brand">CortiCorp</div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="tag" id="tag"></div>
  </div>
  <div class="url" id="url"></div>
  <div id="art"></div>
</body>
</html>
